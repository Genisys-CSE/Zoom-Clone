# Render Blueprint — one-click backend deploy.
# Render Dashboard → New → Blueprint → select this repo.
# Then set FRONTEND_ORIGIN to your Vercel URL and run seed.py once
# from the service's Shell tab.
services:
  - type: web
    name: zoom-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.12.0
